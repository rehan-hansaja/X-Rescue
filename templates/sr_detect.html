{% extends "base.html" %}
{% block content %}

<h1 class="page-title">Super-Resolution & Fracture Detection</h1>

<div class="upload-card">
    <form method="POST" enctype="multipart/form-data">
        <label for="image-upload" class="upload-label">
            Upload Low-Resolution X-ray Image
        </label>
        <input type="file" id="image-upload" name="image" accept="image/*" required
               onchange="previewInput(event)" class="file-input">
        <button type="submit" class="analyze-btn">Enhance Resolution</button>
    </form>
</div>

<div class="results-grid">
<!-- Left: Input Preview -->
    <div class="result-card input-card" id="input-card"
         style="{% if not input_image %}display: none;{% endif %}">
        <h3>Low Resolution Input</h3>
        <div class="image-wrapper">
            <img id="input-preview"
                 src="{% if input_image %}{{ url_for('input_file', filename=input_image) }}{% else %}#{% endif %}"
                 alt="Input X-ray"
                 class="result-image">
        </div>
    </div>

    <!-- Right: Super-Resolution result (only after processing) -->
    {% if output_image %}
    <div class="result-card sr-card">
        <h3>Super-Resolution Result (4×)</h3>
        <div class="image-wrapper">
            <img src="{{ url_for('output_file', filename=output_image) }}"
                 alt="Super-Resolved X-ray"
                 class="result-image">
        </div>

        <div class="actions">
            <a href="{{ url_for('output_file', filename=output_image) }}"
               download class="download-btn">
                Download Enhanced Image
            </a>
        </div>
    </div>
    {% endif %}
</div>

{% if output_image %}
<div class="next-step">
    <form action="{{ url_for('detect_fracture') }}" method="post">
        <input type="hidden" name="filename" value="{{ output_image }}">
        <button type="submit" class="continue-btn">
            Continue to Fracture Detection →
        </button>
    </form>
</div>
{% endif %}

<div id="loading-overlay" style="display:none;">
    <div class="loading-box">
        <div class="spinner"></div>
        <p id="loading-msg">Processing, please wait...</p>
    </div>
</div>

<script>
function previewInput(event) {
    const preview = document.getElementById("input-preview");
    const card = document.getElementById("input-card");
    if (event.target.files && event.target.files[0]) {
        preview.src = URL.createObjectURL(event.target.files[0]);
        card.style.display = "block";
    }
}

    document.querySelector("form").addEventListener("submit", function() {
    document.getElementById("loading-msg").textContent = "Running Super Resolution, please wait...";
    document.getElementById("loading-overlay").style.display = "flex";
});

    document.querySelector(".next-step form").addEventListener("submit", function() {
    document.getElementById("loading-msg").textContent = "Detecting fractures, please wait...";
    document.getElementById("loading-overlay").style.display = "flex";
});
</script>


{% endblock %}
